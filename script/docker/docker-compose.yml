# =============================================================================
# Stack Depth 博客 · 生产形态一键启动（S25）
#
# 用法：
#   cd RuoYi-Vue-Plus/script/docker
#   cp .env.example .env      # 按需改密钥，至少改 MYSQL_ROOT_PASSWORD
#   docker compose up -d --build
#
# 访问：
#   前台   http://localhost:3000
#   后台   http://localhost:8080
#   后端   http://localhost:8081
#   MinIO  http://localhost:9001（控制台）
#
# 与 docker-compose.dev.yml 的区别：
#   本文件固定镜像 tag、密钥走 .env、不挂源码、默认起全部 7 个服务；
#   dev 文件面向本机开发，应用服务在 `app` profile 下按需起。
# =============================================================================

services:

  mysql:
    image: mysql:8.4.9
    container_name: blog-mysql
    restart: unless-stopped
    environment:
      TZ: Asia/Shanghai
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: ry-vue
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      # 首次启动（数据卷为空）时自动执行，按文件名排序：
      #   ① RuoYi 核心表 + 菜单 + 默认数据
      #   ② 博客业务表（sd_blog_ 前缀 7 张）
      # 明确不导入 ry_workflow / ry_job / ry_ai —— 属独立服务模块，博客 MVP 不使用（ROADMAP D10）。
      # ⚠️ 不能挂整个 ../sql 目录：里面 7 个 blog*Menu.sql 按字母序排在 ry_vue.sql 之前，
      #    会在 sys_menu 尚不存在时执行（ERROR 1146）并让建表脚本无法按预期落地（实测踩过）。
      - ../sql/ry_vue.sql:/docker-entrypoint-initdb.d/01-ry-vue.sql:ro
      - ../../docs/blog_schema_v0.1.sql:/docker-entrypoint-initdb.d/02-blog-schema.sql:ro
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_general_ci
      - --explicit_defaults_for_timestamp=true
      - --lower_case_table_names=1
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p${MYSQL_ROOT_PASSWORD:-root}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  redis:
    image: redis:8.6.3
    container_name: blog-redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD:-ruoyi123}
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-ruoyi123}", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  minio:
    image: pgsty/minio:RELEASE.2026-04-17T00-00-00Z
    container_name: blog-minio
    restart: unless-stopped
    environment:
      TZ: Asia/Shanghai
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-ruoyi}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-ruoyi123}
    command: server --address ":9000" --console-address ":9001" /data
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Elasticsearch 7.17.28 + IK（构建上下文 script/docker/es）
  # 前置：宿主机 vm.max_map_count ≥ 262144，否则起不来
  es:
    build:
      context: ./es
      dockerfile: Dockerfile
    image: blog-es:7.17.28-ik
    container_name: blog-es
    restart: unless-stopped
    environment:
      TZ: Asia/Shanghai
      ES_JAVA_OPTS: -Xms512m -Xmx512m
      discovery.type: single-node
      xpack.security.enabled: "false"
      xpack.monitoring.enabled: "false"
    ports:
      - "9200:9200"
    volumes:
      - es-data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://127.0.0.1:9200/_cluster/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 60s

  backend:
    image: sd-backend:${TAG:-latest}
    container_name: blog-backend
    build:
      context: ../..
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      TZ: Asia/Shanghai
      # 数据源：RuoYi 用 dynamic-datasource，key 是 spring.datasource.dynamic.datasource.master.*
      # Spring relaxed binding 允许用大写+下划线覆盖嵌套 Map（P1 已实测生效）
      SPRING_DATASOURCE_DYNAMIC_DATASOURCE_MASTER_URL: jdbc:mysql://mysql:3306/ry-vue?useUnicode=true&characterEncoding=utf8&zeroDateTimeBehavior=convertToNull&useSSL=false&serverTimezone=GMT%2B8&allowPublicKeyRetrieval=true&nullCatalogMeansCurrent=true
      SPRING_DATASOURCE_DYNAMIC_DATASOURCE_MASTER_USERNAME: root
      SPRING_DATASOURCE_DYNAMIC_DATASOURCE_MASTER_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: "6379"
      SPRING_DATA_REDIS_PASSWORD: ${REDIS_PASSWORD:-ruoyi123}
      # 博客搜索：自定义键 blog.es.address（@Value 绑定，非标准 spring.elasticsearch）
      BLOG_ES_ADDRESS: es:9200
      JAVA_OPTS: ${JAVA_OPTS:--Xms512m -Xmx1024m}
    ports:
      - "${BACKEND_PORT:-8081}:8081"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      # ES 启动慢且搜索可自动降级到 MySQL，不强等健康
      es:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://127.0.0.1:8081/"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s

  web:
    image: blog-web:${TAG:-latest}
    container_name: blog-web
    build:
      context: ../../../blog-web
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      TZ: Asia/Shanghai
      NUXT_HOST: 0.0.0.0
      NUXT_PORT: "3000"
      # 容器间用服务名（不再走 host.docker.internal）
      NUXT_API_BASE: http://backend:8081
      NUXT_APP_CLIENT_ID: ${NUXT_APP_CLIENT_ID:-}
      NUXT_RSA_PUBLIC_KEY: ${NUXT_RSA_PUBLIC_KEY:-}
      NUXT_RSA_PRIVATE_KEY: ${NUXT_RSA_PRIVATE_KEY:-}
      NUXT_PUBLIC_SITE_URL: ${PUBLIC_SITE_URL:-http://localhost:3000}
    ports:
      - "${WEB_PORT:-3000}:3000"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:3000/"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s

  admin:
    image: sd-admin:${TAG:-latest}
    container_name: blog-admin
    build:
      context: ../../../plus-ui
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      TZ: Asia/Shanghai
    ports:
      - "${ADMIN_PORT:-8080}:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  mysql-data:
  redis-data:
  minio-data:
  es-data:
