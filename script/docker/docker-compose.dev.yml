services:

  mysql:
    image: mysql:8.4.9
    container_name: blog-mysql
    restart: unless-stopped
    environment:
      TZ: Asia/Shanghai
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: ry-vue
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_general_ci
      - --explicit_defaults_for_timestamp=true
      - --lower_case_table_names=1

  redis:
    image: redis:8.6.3
    container_name: blog-redis
    restart: unless-stopped
    command: redis-server --requirepass ruoyi123
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data

  minio:
    image: pgsty/minio:RELEASE.2026-04-17T00-00-00Z
    container_name: blog-minio
    restart: unless-stopped
    environment:
      TZ: Asia/Shanghai
      MINIO_ROOT_USER: ruoyi
      MINIO_ROOT_PASSWORD: ruoyi123
    command: server --address ":9000" --console-address ":9001" /data
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data

  # blog-web 前台（Nuxt 4 SSR，node-server 镜像）——profile 门控，不影响默认 `up -d` 的三件套
  # 启动：docker compose -f docker-compose.dev.yml --profile web up -d --build
  # 构建上下文是同级仓库 blog-web（SETUP §10.1 同级 clone 为硬性前提）；镜像内 npm ci + nuxt build
  # 密钥（web client_id、RSA 公私钥）不入库：由 blog-web/.env 或 shell 导出后 compose 透传
  web:
    image: blog-web:dev
    container_name: blog-web
    profiles: ["web"]
    build:
      context: ../../blog-web
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      TZ: Asia/Shanghai
      NUXT_HOST: 0.0.0.0
      NUXT_PORT: "3000"
      # 容器内访问宿主机上跑的后端（DromaraApplication :8081）
      NUXT_API_BASE: http://host.docker.internal:8081
      NUXT_APP_CLIENT_ID: ${NUXT_APP_CLIENT_ID:-}
      NUXT_RSA_PUBLIC_KEY: ${NUXT_RSA_PUBLIC_KEY:-}
      NUXT_RSA_PRIVATE_KEY: ${NUXT_RSA_PRIVATE_KEY:-}
    ports:
      - "3000:3000"
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  mysql-data:
  redis-data:
  minio-data:
