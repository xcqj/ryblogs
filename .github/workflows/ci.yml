name: CI

on:
  push:
    branches: [6.X]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
          cache: maven

      # 门禁从"能编译"升为"编译 + 全部单测"：
      # sd-blog 11 个测试类（净化/限流/搜索/状态机/阅读量…）+ ruoyi-admin 社交账号命名
      - name: Compile & Test
        run: ./mvnw -B -ntp clean verify
