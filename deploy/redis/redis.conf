# =============================================================================
# 演示/部署用 Redis 配置（S29.1）
#
# 与 script/docker/redis/conf/redis.conf 的差异只有两处，都是部署形态决定的：
#   1) dir 从 /redis/data 改为 /data —— 容器内挂载点是 ${DATA_DIR}/redis:/data
#   2) 不在此文件写 requirepass —— 口令由 compose command 从 .env 注入，
#      避免口令进仓库（本文件是入库的）
#
# 为什么现在才开 AOF：S15-D1 ④ 记录了"宿主 redis 未开 AOF，属仓库外手动步骤"，
# 生产形态必须落进部署包，否则阅读量增量在容器重启时丢失（DB 为唯一真相源，
# 丢的是最近 ≤10s 未 flush 的增量，可接受但不该由"忘了配"造成）。
# =============================================================================

dir /data

# ---- RDB（保留，仅作兜底）----
save 900 1
save 300 10
save 60 10000
rdbcompression yes
dbfilename dump.rdb

# ---- AOF（主持久化）----
appendonly yes
appendfilename "appendonly.aof"
appendfsync everysec
