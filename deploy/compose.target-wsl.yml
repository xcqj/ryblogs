# =============================================================================
# 目标覆盖层：WSL2 演示栈（S29.1）
#
# 只做三件事：项目名隔离、宿主机端口、内存上限。
# 端口一律只绑 127.0.0.1 —— 公网入口由 Cloudflare Tunnel 从本机回环取，不需要 0.0.0.0。
#
# ⚠️ 副作用（预期行为，不是故障）：Windows 侧浏览器打不开 localhost:19300
#   （WSL2 只把绑 0.0.0.0 的端口转发给 Windows）。本地自检用 WSL 内 curl，
#   肉眼验收走公网域名 https://sdblog.us.ci。
#
# 端口三段（不允许重叠）：
#   开发态（宿主机直跑） 8081 / 3000 / 5173
#   容器化开发（dev compose --profile app） 18081 / 3100 / 8080
#   演示态（本文件） 19081 / 19080 / 19300 + deps 13306 / 16379 / 19000-19001 / 19200
# =============================================================================

name: sdblog-demo

services:

  mysql:
    ports:
      - "127.0.0.1:${MYSQL_PORT:-13306}:3306"
    mem_limit: ${MYSQL_MEM:-800m}

  redis:
    ports:
      - "127.0.0.1:${REDIS_PORT:-16379}:6379"
    mem_limit: ${REDIS_MEM:-128m}

  minio:
    ports:
      - "127.0.0.1:${MINIO_PORT:-19000}:9000"
      - "127.0.0.1:${MINIO_CONSOLE_PORT:-19001}:9001"
    mem_limit: ${MINIO_MEM:-256m}

  es:
    ports:
      - "127.0.0.1:${ES_PORT:-19200}:9200"
    # ES 的 mem_limit 必须明显大于堆（堆 256m + Lucene 直接内存），
    # 否则 OOM 会打到容器内的 JVM 而不是被 cgroup 拦在外面
    mem_limit: ${ES_MEM:-900m}

  backend:
    ports:
      - "127.0.0.1:${BACKEND_PORT:-19081}:8081"
    mem_limit: ${BACKEND_MEM:-1g}
    environment:
      # WSL 内存紧张：Xmx512m 起步；出现 OOM 时先看 .env 的 BACKEND_MEM 与 JAVA_OPTS
      JAVA_OPTS: ${JAVA_OPTS:--Xms256m -Xmx512m}

  web:
    ports:
      - "127.0.0.1:${WEB_PORT:-19300}:3000"
    mem_limit: ${WEB_MEM:-512m}

  admin:
    ports:
      - "127.0.0.1:${ADMIN_PORT:-19080}:80"
    mem_limit: ${ADMIN_MEM:-128m}
